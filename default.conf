server {
    listen       80;
    server_name  localhost;

    # Where your built files live inside the container:
    root   /usr/share/nginx/html;
    index  index.html;

    # Serve static files directly, but if not found, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: if you have an API served by the same Nginx,
    # you could proxy /api to your backend here.
    # location /api {
    #   proxy_pass http://backend:80;
    # }
}
